name: Build APK (Docker)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: kivy/buildozer:latest
      options: --user root

    steps:
      - uses: actions/checkout@v4

      - name: Show environment (verification)
        run: |
          echo "=== Python ==="
          python3 --version
          which python3
          echo "=== Pip ==="
          python3 -m pip --version
          echo "=== Cython ==="
          python3 -c "import Cython; print(Cython.__version__)"
          echo "=== Java ==="
          java -version 2>&1 || echo "Java not in container"
          echo "=== Swap ==="
          free -h

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-global-

      - name: Cache Buildozer project directory
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-project-${{ github.sha }}
          restore-keys: |
            buildozer-project-

      - name: Build with Buildozer
        run: |
          yes | buildozer android debug 2>&1 | tee build.log

      - name: Show last 200 lines if failed
        if: failure()
        run: |
          echo "=== آخر 200 سطر ==="
          tail -n 200 build.log
          echo ""
          echo "=== الأخطاء ==="
          grep -nE "error:|Error:|ERROR|FAILED|Traceback" build.log | tail -50 || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
