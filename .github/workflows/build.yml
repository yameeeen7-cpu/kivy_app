name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Purge Python 3.14 and Install Python 3.9
        run: |
          # إزالة وحذف أي أثر لبايثون 3.14 من السيرفر نهائياً لمنع تداخله
          sudo apt-get purge -y python3.14 python3.14-dev python3.14-minimal python3.14-lib 2>/dev/null || true
          
          # إضافة مستودع بايثون الرسمي وتثبيت الإصدار 3.9 بدقة
          sudo add-apt-repository ppa:deadsnakes/ppa -y
          sudo apt-get update
          sudo apt-get install -y python3.9 python3.9-dev python3.9-venv python3.9-distutils
          
          # إزالة أداة command-not-found لمنع أي مشاكل مع apt_pkg
          sudo apt-get remove -y command-not-found || true
          
          # توجيه أمر python3 في النظام بالكامل ليكون بايثون 3.9 حصرياً
          sudo update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.9 1
          sudo update-alternatives --set python3 /usr/bin/python3.9
          
          # التحقق المباشر
          python3 --version
          python --version

      - name: Set up Swap Space
        run: |
          sudo swapoff /swapfile || true
          sudo rm -f /swapfile
          sudo dd if=/dev/zero of=/swapfile bs=1M count=4096 status=progress
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Install dependencies
        run: |
          sudo apt-get install -y \
              python3-pip \
              build-essential \
              git \
              ffmpeg \
              libsdl2-dev \
              libsdl2-image-dev \
              libsdl2-mixer-dev \
              libsdl2-ttf-dev \
              libportmidi-dev \
              libswscale-dev \
              libavformat-dev \
              libavcodec-dev \
              zlib1g-dev \
              ant \
              openjdk-17-jdk \
              autoconf \
              libtool \
              pkg-config \
              libncurses5-dev \
              libstdc++6 \
              libglu1-mesa-dev \
              unzip \
              zip

      - name: Install Buildozer and Cython
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "setuptools<=65.5.0" "cython==0.29.32" buildozer

      - name: Build with Buildozer
        run: |
          unset ANDROID_NDK
          export CFLAGS="-Wno-error -Wno-implicit-function-declaration -Wno-int-conversion -w"
          export CPPFLAGS="-Wno-error -w"
          export LDFLAGS="-Wno-error"
          export MAKEFLAGS="-j1"
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
