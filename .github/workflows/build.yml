name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: kivy/buildozer:latest
      options: --user root

    steps:
      - uses: actions/checkout@v4

      - name: Show environment
        run: |
          echo "=== Python ==="
          python3 --version
          echo "=== Workspace ==="
          pwd
          ls -la

      - name: Free disk space (critical)
        run: |
          echo "=== Before cleanup ==="
          df -h
          # حذف الملفات غير الضرورية
          rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk 2>/dev/null || true
          rm -rf /opt/ghc /usr/local/share/boost 2>/dev/null || true
          apt-get clean || true
          echo "=== After cleanup ==="
          df -h

      - name: Build with Buildozer
        id: build_step
        run: |
          echo "=== START BUILD ==="
          buildozer android debug 2>&1 | tee build.log
          echo "=== END BUILD with exit code $? ==="
          echo "=== Checking for APK immediately after build ==="
          ls -la bin/ 2>/dev/null || echo "bin/ NOT FOUND"
          find . -name "*.apk" -type f 2>/dev/null || echo "NO APK FOUND"
        continue-on-error: true

      - name: Check build results
        if: always()
        run: |
          echo "=========================================="
          echo "  1. هل bin/ موجود؟"
          echo "=========================================="
          ls -la bin/ 2>/dev/null && echo "✅ bin/ موجود" || echo "❌ bin/ غير موجود"
          echo ""
          echo "=========================================="
          echo "  2. البحث عن APK في كل مكان"
          echo "=========================================="
          find / -name "*.apk" -type f 2>/dev/null | head -20 || echo "❌ لا APK"
          echo ""
          echo "=========================================="
          echo "  3. آخر 150 سطر من السجل"
          echo "=========================================="
          tail -n 150 build.log
          echo ""
          echo "=========================================="
          echo "  4. هل يوجد خطأ في السجل؟"
          echo "=========================================="
          grep -nE "error:|Error:|ERROR|FAILED|Traceback|BUILD FAILED" build.log | tail -30 || echo "✅ لا أخطاء واضحة"
          echo ""
          echo "=========================================="
          echo "  5. المساحة المتبقية"
          echo "=========================================="
          df -h

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK (only if exists)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            bin/*.apk
            **/*.apk
          if-no-files-found: warn
