name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Verify Python version
        run: |
          python --version
          python3 --version
          python -m pip --version

      - name: Set up Swap Space
        run: |
          sudo swapoff /swapfile || true
          sudo rm -f /swapfile
          sudo dd if=/dev/zero of=/swapfile bs=1M count=4096 status=progress
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3.9 python3.9-dev python3.9-venv \
            python3-pip \
            build-essential git \
            ffmpeg \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
            zlib1g-dev ant openjdk-17-jdk \
            autoconf libtool pkg-config \
            libncurses5-dev libstdc++6 libglu1-mesa-dev \
            unzip zip ccache

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install "setuptools<=65.5.0" "cython==0.29.33" buildozer

      - name: Verify Cython and Buildozer
        run: |
          python -c "import Cython; print('Cython:', Cython.__version__)"
          buildozer --version

      - name: Build with Buildozer
        run: |
          buildozer -v android debug 2>&1 | tee build.log
        continue-on-error: true

      - name: Show build log on failure
        if: always()
        run: |
          if [ -f build.log ]; then
            tail -n 150 build.log
          else
            echo "Build log file does not exist because the build failed before generation."
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
