name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Show environment
        run: |
          echo "=== Docker ==="
          docker --version
          echo "=== Workspace ==="
          pwd
          ls -la

      - name: Pull Buildozer Docker image
        run: |
          docker pull kivy/buildozer:latest
          docker images

      - name: Build APK inside Docker
        run: |
          docker run --rm \
            -v "$PWD":/home/user/hostcwd \
            -v "$HOME/.buildozer":/home/user/.buildozer \
            -w /home/user/hostcwd \
            kivy/buildozer:latest \
            buildozer -v android debug 2>&1 | tee build.log

      - name: Show build results
        if: always()
        run: |
          echo "=== bin/ ==="
          ls -la bin/ 2>/dev/null || echo "bin غير موجود"
          echo "=== البحث عن APK ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "لا APK"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
          if-no-files-found: warn
