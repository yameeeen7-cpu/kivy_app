name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      # ============================================================
      # 1. تثبيت Python 3.10 يدوياً (لتجنب الإصدار الافتراضي الحديث)
      # ============================================================
      - name: 1. Install Python 3.10 manually
        run: |
          sudo add-apt-repository ppa:deadsnakes/ppa -y
          sudo apt-get update
          sudo apt-get install -y \
            python3.10 python3.10-dev python3.10-venv python3.10-distutils \
            python3.10-tk

      # ============================================================
      # 2. إنشاء بيئة معزولة (Virtual Environment)
      # ============================================================
      - name: 2. Create virtualenv
        run: |
          python3.10 -m venv venv
          venv/bin/python --version
          venv/bin/pip --version

      # ============================================================
      # 3. تثبيت تبعيات النظام
      # ============================================================
      - name: 3. Install system dependencies
        run: |
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev

      # ============================================================
      # 4. تثبيت Buildozer و Cython داخل البيئة المعزولة
      # ============================================================
      - name: 4. Install Buildozer and Cython
        run: |
          venv/bin/pip install --upgrade pip wheel
          venv/bin/pip install "cython==0.29.33" "setuptools<=65.5.0"
          venv/bin/pip install buildozer

      # ============================================================
      # 5. التحقق من الإصدارات
      # ============================================================
      - name: 5. Verify versions
        run: |
          echo "=== Python ==="
          venv/bin/python --version
          echo "=== Cython ==="
          venv/bin/python -c "import Cython; print(Cython.__version__)"
          echo "=== Buildozer ==="
          venv/bin/buildozer --version

      # ============================================================
      # 6. البناء
      # ============================================================
      - name: 6. Build APK
        run: |
          rm -rf .buildozer ~/.buildozer bin
          export PATH="$PWD/venv/bin:$PATH"
          yes | venv/bin/buildozer -v android debug

      # ============================================================
      # 7. رفع APK
      # ============================================================
      - name: 7. Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
          if-no-files-found: warn
