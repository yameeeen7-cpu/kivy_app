name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:22.04
      options: --user root

    steps:
      - uses: actions/checkout@v4

      - name: Install Python 3.10
        run: |
          apt-get update
          apt-get install -y software-properties-common
          add-apt-repository -y ppa:deadsnakes/ppa
          apt-get update
          apt-get install -y python3.10 python3.10-dev python3.10-venv python3.10-distutils

      - name: Install system dependencies
        run: |
          apt-get install -y git zip unzip openjdk-17-jdk autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          python3.10 -m pip install --upgrade pip
          python3.10 -m pip install "cython==0.29.33" "setuptools<=65.5.0" buildozer

      - name: Build with Buildozer
        run: |
          rm -rf .buildozer ~/.buildozer bin
          python3.10 -m buildozer -v android debug 2>&1 | tee build.log

      - name: Show build results
        if: always()
        run: |
          echo "=== bin/ ==="
          ls -la bin/ 2>/dev/null || echo "no bin"
          find / -name "*.apk" -type f 2>/dev/null | head -20 || echo "no APK"
          tail -n 50 build.log 2>/dev/null || echo "no log"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            bin/*.apk
            **/*.apk
          if-no-files-found: warn
