name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: kivy/buildozer:latest
      options: --user root

    steps:
      - uses: actions/checkout@v4

      - name: Show environment
        run: |
          echo "=== Python ==="
          python3 --version
          echo "=== Workspace ==="
          pwd
          ls -la
          echo "=== Check for leftover cache ==="
          ls -la .buildozer 2>/dev/null || echo "✅ No .buildozer"
          ls -la ~/.buildozer 2>/dev/null || echo "✅ No ~/.buildozer"
          ls -la bin/ 2>/dev/null || echo "✅ No bin/"

      - name: Free disk space
        run: |
          echo "=== Before cleanup ==="
          df -h
          rm -rf /usr/share/dotnet /usr/local/share/boost 2>/dev/null || true
          apt-get clean || true
          echo "=== After cleanup ==="
          df -h

      - name: Clean Buildozer state
        run: |
          echo "=== حذف جميع ملفات Cache القديمة ==="
          rm -rf .buildozer
          rm -rf ~/.buildozer
          rm -rf bin
          echo "✅ تم الحذف"
          echo ""
          echo "=== التحقق ==="
          ls -la .buildozer 2>/dev/null && echo "❌ .buildozer لا يزال موجوداً" || echo "✅ .buildozer محذوف"
          ls -la ~/.buildozer 2>/dev/null && echo "❌ ~/.buildozer لا يزال موجوداً" || echo "✅ ~/.buildozer محذوف"

      - name: Verify buildozer.spec exists
        run: |
          if [ ! -f buildozer.spec ]; then
            echo "❌ buildozer.spec غير موجود!"
            exit 1
          fi
          echo "✅ buildozer.spec موجود"
          echo "=== محتوى buildozer.spec ==="
          cat buildozer.spec

      - name: Build with Buildozer (clean)
        id: build_step
        run: |
          echo "=== START BUILD ==="
          echo "الوقت الحالي: $(date)"
          buildozer -v android debug 2>&1 | tee build.log
          EXIT_CODE=$?
          echo "=== END BUILD with exit code $EXIT_CODE ==="
          echo "الوقت الحالي: $(date)"
          echo ""
          echo "=== Checking for APK immediately ==="
          ls -la bin/ 2>/dev/null || echo "bin/ NOT FOUND"
          find . -name "*.apk" -type f 2>/dev/null || echo "NO APK"
          exit $EXIT_CODE
        continue-on-error: true

      - name: Check build results
        if: always()
        run: |
          echo "=========================================="
          echo "  1. هل bin/ موجود؟"
          echo "=========================================="
          ls -la bin/ 2>/dev/null && echo "✅ bin/ موجود" || echo "❌ bin/ غير موجود"
          echo ""
          echo "=========================================="
          echo "  2. البحث عن APK في كل مكان"
          echo "=========================================="
          find / -name "*.apk" -type f 2>/dev/null | head -20 || echo "❌ لا APK"
          echo ""
          echo "=========================================="
          echo "  3. آخر 200 سطر من السجل"
          echo "=========================================="
          tail -n 200 build.log
          echo ""
          echo "=========================================="
          echo "  4. الأخطاء في السجل"
          echo "=========================================="
          grep -nE "error:|Error:|ERROR|FAILED|Traceback|BUILD FAILED|No space" build.log | tail -40 || echo "✅ لا أخطاء واضحة"
          echo ""
          echo "=========================================="
          echo "  5. المساحة"
          echo "=========================================="
          df -h

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK (if exists)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            bin/*.apk
            **/*.apk
          if-no-files-found: warn
