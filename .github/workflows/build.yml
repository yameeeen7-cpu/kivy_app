name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: 1. Install Python 3.10
        run: |
          sudo add-apt-repository ppa:deadsnakes/ppa -y
          sudo apt-get update
          sudo apt-get install -y \
            python3.10 python3.10-dev python3.10-venv python3.10-distutils

      - name: 2. Set Python 3.10 as default
        run: |
          sudo update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.10 1
          sudo update-alternatives --set python3 /usr/bin/python3.10
          python3 --version
          python3 -m pip --version

      - name: 3. Install system dependencies
        run: |
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf automake libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev

      # 🔴 لا venv — تثبيت مباشر مع --user
      - name: 4. Install Buildozer with --user
        run: |
          python3 -m pip install --user --upgrade pip wheel
          python3 -m pip install --user "cython==0.29.33" "setuptools<=65.5.0"
          python3 -m pip install --user buildozer

      - name: 5. Add ~/.local/bin to PATH
        run: |
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "PATH=$PATH"

      - name: 6. Verify Buildozer
        run: |
          python3 --version
          python3 -c "import Cython; print('Cython:', Cython.__version__)"
          buildozer --version

      - name: 7. Build APK
        run: |
          rm -rf .buildozer ~/.buildozer bin
          buildozer -v android debug
        timeout-minutes: 60

      - name: 8. Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
          if-no-files-found: warn
