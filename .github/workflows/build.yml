name: Build APK (Diagnostic)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: kivy/buildozer:latest
      options: --user root

    steps:
      - uses: actions/checkout@v4

      # ============================================================
      # الخطوة 1: عرض كل شيء عن البيئة
      # ============================================================
      - name: 1. Environment dump
        run: |
          echo "=========================================="
          echo "  1. البيئة"
          echo "=========================================="
          echo "PWD: $(pwd)"
          echo "USER: $(whoami)"
          echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
          echo ""
          echo "=== Python ==="
          which python python3
          python3 --version
          echo ""
          echo "=== Buildozer ==="
          which buildozer
          buildozer --version
          echo ""
          echo "=== Cython ==="
          python3 -c "import Cython; print(Cython.__version__)" 2>&1
          echo ""
          echo "=== Java ==="
          which java
          java -version 2>&1
          echo ""
          echo "=== Files in workspace ==="
          ls -la
          echo ""
          echo "=== محتوى buildozer.spec ==="
          cat buildozer.spec
          echo ""
          echo "=== محتوى main.py (أول 20 سطر) ==="
          head -20 main.py

      # ============================================================
      # الخطوة 2: Clean State
      # ============================================================
      - name: 2. Clean state
        run: |
          rm -rf .buildozer ~/.buildozer bin
          echo "✅ Cleaned"

      # ============================================================
      # الخطوة 3: البناء مع كل المخرجات
      # ============================================================
      - name: 3. Build with full output
        id: build
        continue-on-error: true
        run: |
          echo "=========================================="
          echo "  بدء البناء: $(date)"
          echo "=========================================="
          echo ""
          
          # تشغيل البناء مع -v (verbose) وحفظ السجلات
          buildozer -v android debug > /tmp/build_output.log 2>&1
          BUILD_EXIT=$?
          
          echo "=========================================="
          echo "  انتهى البناء: $(date)"
          echo "  Exit code: $BUILD_EXIT"
          echo "=========================================="
          echo ""
          
          # طباعة كل المخرجات (آخر 500 سطر)
          echo "=========================================="
          echo "  كل مخرجات البناء (آخر 500 سطر)"
          echo "=========================================="
          tail -n 500 /tmp/build_output.log
          
          echo ""
          echo "=========================================="
          echo "  عدد أسطر السجل الكامل:"
          echo "=========================================="
          wc -l /tmp/build_output.log
          
          echo ""
          echo "=========================================="
          echo "  البحث عن الأخطاء"
          echo "=========================================="
          grep -nE "error|Error|ERROR|FAILED|Traceback|Exception|No such|not found" /tmp/build_output.log | head -50 || echo "لا أخطاء واضحة"
          
          exit 0

      # ============================================================
      # الخطوة 4: عرض النتائج
      # ============================================================
      - name: 4. Check APK
        if: always()
        run: |
          echo "=== bin/ ==="
          ls -la bin/ 2>/dev/null || echo "❌ bin/ فارغ أو غير موجود"
          echo ""
          echo "=== البحث الشامل عن APK ==="
          find / -name "*.apk" -type f 2>/dev/null | head -20 || echo "❌ لا APK"
          echo ""
          echo "=== .buildozer ==="
          ls -la .buildozer/ 2>/dev/null || echo "❌ .buildozer غير موجود"

      # ============================================================
      # الخطوة 5: رفع السجلات
      # ============================================================
      - name: 5. Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            /tmp/build_output.log
            buildozer.spec
            main.py
          if-no-files-found: warn

      - name: 6. Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            bin/*.apk
            **/*.apk
          if-no-files-found: warn
