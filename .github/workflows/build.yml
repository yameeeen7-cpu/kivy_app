name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Show environment
        run: |
          echo "=== Docker ==="
          docker --version
          echo "=== Workspace ==="
          pwd
          ls -la
          echo "=== buildozer.spec ==="
          cat buildozer.spec
          echo "=== main.py (first 10 lines) ==="
          head -10 main.py

      - name: Pull Buildozer Docker image
        run: |
          docker pull kivy/buildozer:latest

      - name: Build APK inside Docker
        run: |
          docker run --rm \
            -v "$PWD":/home/user/hostcwd \
            -v "$HOME/.buildozer":/home/user/.buildozer \
            -w /home/user/hostcwd \
            kivy/buildozer:latest \
            sh -c "
              echo '===== INSIDE CONTAINER ====='
              echo '--- PWD ---'
              pwd
              echo '--- Files ---'
              ls -la
              echo '--- buildozer.spec ---'
              cat buildozer.spec || echo 'BUILDOZER.SPEC NOT FOUND'
              echo '--- main.py (first 5 lines) ---'
              head -5 main.py || echo 'MAIN.PY NOT FOUND'
              echo '--- Buildozer version ---'
              buildozer --version
              echo '===== STARTING BUILD ====='
              buildozer -v android debug
            " 2>&1 | tee build.log

      - name: Show build results
        if: always()
        run: |
          echo "=== bin/ ==="
          ls -la bin/ 2>/dev/null || echo "bin not found"
          echo "=== Search for APK ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "no APK found"
          echo "=== Last 100 lines of log ==="
          tail -n 100 build.log 2>/dev/null || echo "no log"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
          if-no-files-found: warn
