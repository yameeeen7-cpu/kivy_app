name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: kivy/buildozer:latest
      options: --user root

    steps:
      - uses: actions/checkout@v4

      - name: Build with Buildozer
        run: |
          rm -rf .buildozer ~/.buildozer bin
          buildozer -v android debug 2>&1 | tee build.log

      - name: Show build results
        if: always()
        run: |
          echo "=== bin/ ==="
          ls -la bin/ 2>/dev/null || echo "no bin"
          echo "=== Search for APK ==="
          find / -name "*.apk" -type f 2>/dev/null | head -20 || echo "no APK"
          echo "=== Last 50 lines ==="
          tail -n 50 build.log 2>/dev/null || echo "no log"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            bin/*.apk
            **/*.apk
          if-no-files-found: warn
