name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Prepare directories
        run: |
          mkdir -p "$HOME/.buildozer"
          mkdir -p bin
          echo "=== Files in workspace ==="
          ls -la
          echo "=== buildozer.spec exists? ==="
          ls -la buildozer.spec
          echo "=== main.py exists? ==="
          ls -la main.py

      - name: Pull Buildozer Docker image
        run: |
          docker pull kivy/buildozer:latest

      - name: Test Docker container
        run: |
          echo "=== Testing container ==="
          docker run --rm --entrypoint sh kivy/buildozer:latest -c "echo 'Container works'; pwd"
          echo "=== Container test done ==="

      - name: Build APK inside Docker
        run: |
          set -o pipefail
          docker run --rm \
            --entrypoint sh \
            -v "$PWD":/home/user/hostcwd \
            -v "$HOME/.buildozer":/home/user/.buildozer \
            -w /home/user/hostcwd \
            kivy/buildozer:latest \
            -c "echo '===== INSIDE CONTAINER =====' && ls -la && echo '===== BUILDING =====' && buildozer -v android debug" \
            2>&1 | tee build.log

      - name: Show build results
        if: always()
        run: |
          echo "=== bin/ ==="
          ls -la bin/ 2>/dev/null || echo "bin not found"
          echo "=== Search for APK ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "no APK"
          echo "=== Last 50 lines ==="
          tail -n 50 build.log 2>/dev/null || echo "no log"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
          if-no-files-found: warn
