name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: 1. Purge Python and install 3.10
        run: |
          sudo rm -rf /opt/hostedtoolcache/Python/3.11* || true
          sudo rm -rf /opt/hostedtoolcache/Python/3.12* || true
          sudo rm -rf /opt/hostedtoolcache/Python/3.13* || true
          sudo rm -rf /opt/hostedtoolcache/Python/3.14* || true
          sudo rm -f /usr/bin/python3.14* || true
          sudo rm -f /usr/local/bin/python3.14* || true
          sudo rm -rf /usr/lib/python3.14 || true
          sudo find /usr -name "python3.14*" -delete 2>/dev/null || true
          sudo add-apt-repository ppa:deadsnakes/ppa -y
          sudo apt-get update
          sudo apt-get install -y python3.10 python3.10-dev python3.10-venv python3.10-distutils
          sudo update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.10 1
          sudo update-alternatives --set python3 /usr/bin/python3.10
          python3 --version

      - name: 2. Install system dependencies
        run: |
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf automake libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev

      - name: 3. Install Buildozer
        run: |
          python3 -m pip install --user --upgrade pip wheel
          python3 -m pip install --user "cython==0.29.33" "setuptools<=65.5.0"
          python3 -m pip install --user buildozer

      - name: 4. Add PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: 5. Verify versions
        run: |
          echo "=== Python ==="
          python3 --version
          which python3
          echo "=== Cython ==="
          python3 -c "import Cython; print(Cython.__version__)"
          echo "=== Buildozer ==="
          buildozer --version

      - name: 6. Build APK
        run: |
          rm -rf .buildozer ~/.buildozer bin
          buildozer -v android debug
        timeout-minutes: 60

      - name: 7. Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
          if-no-files-found: warn
